<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise</title>
    <style>
        *{
            background-color: gainsboro;
        }
        img{
            width: 80%;
            border: 1px solid black;
            border-radius: 50px;
        }
        body{
            border: 2px black solid;
            margin: 5%;
            padding: 5%;
        }
        h2{
            text-align: center;
            font-family: sans-serif;
            font-size: 24px;
        }
        h3{
            text-align: center;
            font-family: sans-serif;
            font-size: 16px;
        }
        table{
            margin: auto;
            width: 80%;
            border: 2px black solid;
            text-align: center;
            font-size: 16px;
        }
        th,td{
            border: 2px black solid;
        }
        form{
            width: 50%;
            margin: 15px auto;
            padding: 15px;
            border: 2px solid black;
        }

        footer{
            text-align: center;
            font-family: sans-serif;
            font-size: 12px;            
        }
    </style>
</head>
<body>
    <h2>Exercise-Week 1</h2>
    <hr><br>
    <center><img src="pic1.jpg" alt="picture_example"></center>
    <br>
    <table>
        <tr>
            <th>วันที่</th>
            <th>เดือน</th>
            <th>ปี</th>
        </tr>
        <tr>
            <td>10</td>
            <td>12</td>
            <td>2026</td>
        </tr>
        <tr>
            <td>1</td>
            <td>1</td>
            <td>2027</td>
        </tr>
        <tr>
            <td>8</td>
            <td>15</td>
            <td>2027</td>
        </tr>
    </table>
    <h3>มหาลัยวิทยาลัยของผม : <a href="https://www.psu.ac.th/" target="_blank">PSU</a></h3>
    <form>
        <h2>แบบฟอร์มการลงทะเบียน</h2>
            <label>ชื่อ-นามสกุล:</label><br>
            <input type="text" name="fullname" placeholder="กรอกชื่อ">
            <br>
            <label>อีเมล:</label><br>
            <input type="email" name="email" placeholder="กรอกอีเมล">
            <br>
            <label>เพศ:</label><br>
            <input type="radio" name="gender" value="male"> ชาย
            <input type="radio" name="gender" value="female"> หญิง
            <input type="radio" name="gender" value="other"> อื่น ๆ
            <br>
            <label>วันเกิด:</label><br>
            <input type="date" name="birthday">
            <br>
            <label>ที่อยู่:</label>
            <br>
            <textarea name="address"></textarea>
            <br>
            <label>งานอดิเรก:</label>
            <input type="checkbox" name="hobby" value="game"> เล่นเกม
            <input type="checkbox" name="hobby" value="music"> ฟังเพลง
            <input type="checkbox" name="hobby" value="sport"> เล่นกีฬา
            <br><br>
            <button type="submit">ลงทะเบียน</button>
            <button type="reset">ล้างข้อมูล</button>
    </form>
</body>
<footer>
    <br>

</footer>
</html>
